<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MADRI · RFI × Blueprint</title></head><body><div id="loading" style="font:14px system-ui;padding:24px">Carregando MADRI…</div><script>(async()=>{try{const urls=['data-0.b64','data-1.b64','data-2.b64'];const parts=await Promise.all(urls.map(u=>fetch(u,{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error('Falha ao carregar '+u);return r.text()})));const b=parts.join('').replace(/\s/g,'');const bin=atob(b);const a=Uint8Array.from(bin,c=>c.charCodeAt(0));const ds=new DecompressionStream('gzip');let html=await new Response(new Blob([a]).stream().pipeThrough(ds)).text();const patch=`<script>(function(){var CACHE={};var syncing=false;function esc2(s){return String(s==null?'':s).replace(/[&<>\"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[c]})}function fmt(c){var d=new Date(c);if(isNaN(d))return '';return String(d.getDate()).padStart(2,'0')+'/'+String(d.getMonth()+1).padStart(2,'0')+'/'+d.getFullYear()+' '+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')}function paint(data){CACHE=data||CACHE;var out=document.getElementById('ap-out');if(!out)return;out.querySelectorAll('tbody tr').forEach(function(tr){if(tr.classList.contains('ds-row'))return;var id=tr.querySelector('.ap-id');if(!id)return;var k=id.textContent.trim();var cell=tr.querySelector('td[data-h="Descrição"]');if(!cell)return;var old=cell.querySelector('.cloud-desc');if(old)old.remove();var d=CACHE[k];if(!d||!d.t)return;var box=document.createElement('div');box.className='cloud-desc';box.style.cssText='margin-top:10px;padding:10px 12px;border:1px solid #86efac;background:#f0fdf4;border-radius:8px;display:block';box.innerHTML='<div style="font-size:11px;font-weight:900;text-transform:uppercase;letter-spacing:.04em;color:#166534;margin-bottom:5px">Descrição salva</div><div style="white-space:pre-wrap;line-height:1.45;color:#20201e;font-size:12px">'+esc2(d.t)+'</div><div style="font-size:11px;color:#6b7280;margin-top:6px">'+esc2(d.a||'Sem nome')+(d.c?' · '+fmt(d.c):'')+'</div>';cell.appendChild(box)})}function sync(){if(syncing)return;syncing=true;fetch('/api/descricoes',{cache:'no-store'}).then(function(r){if(!r.ok)throw new Error('HTTP '+r.status);return r.json()}).then(function(d){CACHE=d||{};paint(CACHE)}).catch(function(e){console.error('Falha ao carregar descrições visíveis',e)}).finally(function(){syncing=false})}function boot(){var out=document.getElementById('ap-out');if(!out){setTimeout(boot,100);return}sync();new MutationObserver(function(){setTimeout(function(){paint(CACHE)},0)}).observe(out,{childList:true,subtree:true});out.addEventListener('click',function(e){var b=e.target.closest('button[data-sv]');if(!b)return;var k=b.dataset.sv;var ta=out.querySelector('[data-ta="'+CSS.escape(k)+'"]');var txt=ta?ta.value.trim():'';if(txt){CACHE[k]={t:txt,a:(document.getElementById('ds-au')||{}).value||'Sem nome',c:new Date().toISOString()};setTimeout(function(){paint(CACHE)},50)}setTimeout(sync,350);setTimeout(sync,1000)},true);setInterval(sync,15000)}boot()})();<\/script>`;html=html.replace('</body>',patch+'</body>');document.open();document.write(html);document.close()}catch(e){document.getElementById('loading').textContent='Falha ao carregar: '+e.message;console.error(e)}})();</script></body></html>
