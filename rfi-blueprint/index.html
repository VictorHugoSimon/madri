<!doctype html><html><head><meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate"><meta http-equiv="Pragma" content="no-cache"><meta http-equiv="Expires" content="0"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RFI × Blueprint · Conciliação e abertura dos itens</title><style>body{font-family:Arial,Helvetica,sans-serif;margin:0;background:#f4f6f3;color:#1f2a22}.wrap{max-width:1500px;margin:auto;padding:16px}.top{display:flex;justify-content:space-between;gap:16px;align-items:center;margin-bottom:12px}.top h1{font-size:22px;margin:0}.sub{font-size:12px;color:#6b7280;margin-top:3px}.pill{font-size:11px;font-weight:800;background:#dcfce7;color:#166534;padding:7px 10px;border-radius:999px}.card{background:#fff;border:1px solid #dfe5dc;border-radius:12px;box-shadow:0 1px 2px rgba(0,0,0,.03)}.pad{padding:14px}.ct{font-weight:900;font-size:14px;margin-bottom:10px}.ap-bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:10px}.ap-c{border:1px solid #dfe5dc;background:#fff;border-radius:999px;padding:6px 12px;font:inherit;font-size:12px;font-weight:800;color:#1f2a22;cursor:pointer;display:flex;gap:6px;align-items:center}.ap-c b{font-weight:900}.ap-c.on{background:#15803d;border-color:#15803d;color:#fff}.ap-sel{font:inherit;font-size:12px;font-weight:700;border:1px solid #dfe5dc;border-radius:8px;padding:6px 8px;background:#fff;color:#1f2a22}.ap-chk{display:flex;gap:6px;align-items:center;font-size:12px;font-weight:700;color:#52514e;cursor:pointer}.ap-t{width:100%;border-collapse:collapse;table-layout:fixed;font-size:12px}.ap-t th{background:#14532d;color:#fff;text-align:left;font-size:10px;letter-spacing:.5px;text-transform:uppercase;font-weight:800;padding:9px 8px}.ap-t td{padding:10px 8px;border-bottom:1px solid #eef1ec;vertical-align:top;color:#1f2a22;overflow-wrap:anywhere}.ap-t tr:hover td{background:#f7fdf9}.ap-id{font-weight:900;color:#15803d}.ap-id.nv{color:#1d4ed8}.ap-g{font-weight:800}.ap-s{font-size:11px;color:#6b7280;margin-top:2px}.ap-l{font-size:9.5px;font-weight:800;letter-spacing:.5px;text-transform:uppercase;color:#6b7280;margin-bottom:2px}.ap-sol{margin-top:8px;padding-top:8px;border-top:1px dashed #dfe5dc}.ap-obs{font-size:11px;color:#6b7280;margin-top:4px}.ap-tag{display:inline-block;border-radius:6px;padding:2px 6px;font-size:10.5px;font-weight:800;overflow-wrap:normal;word-break:normal;white-space:nowrap;max-width:100%}.ap-empty{padding:24px;text-align:center;color:#6b7280;font-size:13px}.ds-b{border:1px solid #cbd5d0;background:#fff;font:inherit;font-size:11px;font-weight:800;color:#15803d;border-radius:7px;padding:3px 8px;cursor:pointer;white-space:nowrap;margin-top:6px}.ds-b:hover{background:#f0fdf4}.ds-b.dg{color:#b91c1c}.ds-b.dg:hover{background:#fef2f2}.ds-b.pr{background:#15803d;color:#fff;border-color:#15803d}.ds-b.pr:hover{background:#14532d}.ds-row td{background:#f7fdf9;border-top:0!important}.ds-box{border-left:3px solid #15803d;padding:8px 12px;display:flex;flex-direction:column;gap:6px}.ds-l{font-size:10px;font-weight:800;letter-spacing:.6px;text-transform:uppercase;color:#15803d}.ds-t{font-size:13px;color:#1f2a22;white-space:pre-wrap;text-wrap:pretty}.ds-m{font-size:11px;color:#6b7280}.ds-a{display:flex;gap:6px;flex-wrap:wrap}.ds-ta{width:100%;min-height:72px;font:inherit;font-size:13px;border:1px solid #cbd5d0;border-radius:8px;padding:8px;resize:vertical;box-sizing:border-box}.ds-ta:focus{outline:2px solid #15803d;outline-offset:0}.ds-st{font-size:11px;font-weight:800;padding:3px 9px;border-radius:999px;background:#f1f5f9;color:#52514e}.ds-st.ok{background:#dcfce7;color:#14532d}.ds-saved{margin-top:10px;padding:10px 12px;border:1px solid #86efac;background:#f0fdf4;border-radius:8px}.ds-saved .ds-l{color:#166534}.ds-saved.ds-focus{outline:3px solid #22c55e;outline-offset:2px;box-shadow:0 0 0 6px rgba(34,197,94,.12);transition:all .25s ease}.ds-saved .ds-a{margin-top:8px}.ds-au{font:inherit;font-size:12px;border:1px solid #cbd5d0;border-radius:7px;padding:4px 8px;width:160px}@media(max-width:820px){.ap-t thead{display:none}.ap-t,.ap-t tbody,.ap-t tr,.ap-t td{display:block;width:100%}.ap-t tr{border:1px solid #eef1ec;border-radius:10px;margin-bottom:10px;padding:4px 0}.ap-t td{border:0;padding:6px 12px}.ap-t td[data-h]::before{content:attr(data-h);display:block;font-size:9.5px;font-weight:800;letter-spacing:.5px;text-transform:uppercase;color:#6b7280}.ds-row td{display:block}.ds-row td:before{display:none!important}}</style></head><body><div class="wrap"><div class="top"><div><h1>RFI × Blueprint · Conciliação e abertura dos itens</h1><div class="sub">Implantação NUCCI ERP · MADRI · Governança Instituto Államo</div></div><span class="pill">Base oficial · 908 requisitos</span></div><div class="card pad"><div class="ct">Abertura dos itens</div><div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:10px"><input id="ds-au" class="ds-au" placeholder="Seu nome"><span id="ds-st" class="ds-st">Conectando ao banco…</span></div><div id="ap-bar" class="ap-bar"></div><div id="ap-out"></div></div></div><script>const ITEMS=[];const MODS=[['Comercial',113,111,0,2],['Emissão',78,78,0,0],['Faturamento',74,74,0,0],['Financeiro',107,99,4,4],['Contabilidade',150,110,32,8],['Compras',99,73,11,15],['Estoque',33,31,1,1],['Corporativo',78,73,5,0],['Frota',26,24,0,2],['Oficina',35,35,0,0]];const AB=[['L189','Compras','Compras › Recebimento','Programar o recebimento de Materiais','Parcial','Customizável'],['L190','Compras','Compras › Recebimento','Registrar recebimento físico e fiscal de materiais','Parcial','Customizável'],['L191','Compras','Compras › Recebimento','Realizar conferência de materiais recebidos','Parcial','Customizável'],['L192','Compras','Compras › Recebimento','Registrar divergências no recebimento','Parcial','Customizável'],['L193','Compras','Compras › Recebimento','Efetuar devolução de materiais ao fornecedor','Parcial','Customizável']];for(const x of AB)ITEMS.push({id:x[0],m:x[1],g:x[2].split(' › ')[0],sub:x[2].split(' › ')[1],desc:x[3],ad:x[4],fa:x[5],k:x[4]==='Parcial'?'par':'nao'});const F={k:'*',m:'*',wms:false};const CLR={par:['#fef3c7','#92400e'],nao:['#fee2e2','#991b1b'],nov:['#dbeafe','#1d4ed8']};const FC={'Customizável':['#ede9fe','#5b21b6']};const LBL={'*':'Todos','par':'Parciais','nao':'Não atendidos','nov':'Novos'};var DS={},DE={},AUTOR=localStorage.getItem('madri-autor')||'',ONLINE=false,API='/api';var au=document.getElementById('ds-au');au.value=AUTOR;au.onchange=function(){AUTOR=au.value.trim();localStorage.setItem('madri-autor',AUTOR)};function esc(s){return String(s==null?'':s).replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[c]))}function dt(c){var d=new Date(c);return isNaN(d)?'':d.toLocaleString('pt-BR')}function hh(){var d=new Date();return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')}function st(c,t){var e=document.getElementById('ds-st');e.className='ds-st'+(c?' '+c:'');e.textContent=t}function api(m,p,b){return fetch(API+p,{method:m,headers:{'Content-Type':'application/json','X-Autor':encodeURIComponent(AUTOR||'Sem nome')},cache:'no-store',body:b?JSON.stringify(b):undefined}).then(async r=>{let d={};try{d=await r.json()}catch(_){}if(!r.ok)throw new Error(d.detail||d.error||('HTTP '+r.status));return d})}function tag(t,c){c=c||['#f3f4f6','#52514e'];return '<span class="ap-tag" style="background:'+c[0]+';color:'+c[1]+'">'+esc(t)+'</span>'}function dsSaved(k){var d=DS[k];if(!d||!d.t)return '';return '<div class="ds-saved" data-saved="'+esc(k)+'"><div class="ds-l">Descrição salva</div><div class="ds-t">'+esc(d.t)+'</div><div class="ds-m">'+esc(d.a||'Sem nome')+' · '+dt(d.c)+'</div><div class="ds-a"><button type="button" class="ds-b" data-ed="'+esc(k)+'">Editar</button><button type="button" class="ds-b dg" data-dl="'+esc(k)+'">Excluir</button></div></div>'}function focusSaved(k){requestAnimationFrame(()=>{var el=document.querySelector('[data-saved="'+CSS.escape(k)+'"]');if(!el)return;el.scrollIntoView({behavior:'smooth',block:'center'});el.classList.add('ds-focus');setTimeout(()=>el.classList.remove('ds-focus'),1800)})}function render(){var mods=[...new Set(ITEMS.map(x=>x.m))];var list=ITEMS.filter(x=>(F.k==='*'||x.k===F.k)&&(F.m==='*'||x.m===F.m));document.getElementById('ap-bar').innerHTML=['*','par','nao','nov'].map(k=>'<button class="ap-c'+(F.k===k?' on':'')+'" data-f="'+k+'">'+LBL[k]+' <b>'+ITEMS.filter(x=>(k==='*'||x.k===k)&&(F.m==='*'||x.m===F.m)).length+'</b></button>').join('')+'<select class="ap-sel" id="ap-m"><option value="*">Todos os módulos</option>'+mods.map(m=>'<option'+(F.m===m?' selected':'')+'>'+esc(m)+'</option>').join('')+'</select>';document.getElementById('ap-out').innerHTML=list.length?'<table class="ap-t"><colgroup><col style="width:7%"><col style="width:10%"><col style="width:17%"><col style="width:38%"><col style="width:13%"><col style="width:15%"></colgroup><thead><tr><th>Item</th><th>Módulo</th><th>Agrupamento › Processo</th><th>Descrição</th><th>Aderência</th><th>Forma de atendimento</th></tr></thead><tbody>'+list.map(x=>{var editor=DE[x.id]?'<tr class="ds-row"><td colspan="6"><div class="ds-box"><div class="ds-l">Descrição</div><textarea class="ds-ta" data-ta="'+esc(x.id)+'" placeholder="Escreva a descrição deste item">'+esc(DS[x.id]?DS[x.id].t:'')+'</textarea><div class="ds-a"><button type="button" class="ds-b pr" data-sv="'+esc(x.id)+'">Salvar</button><button type="button" class="ds-b" data-cn="'+esc(x.id)+'">Cancelar</button></div></div></td></tr>':'';return '<tr><td data-h="Item"><span class="ap-id">'+esc(x.id)+'</span></td><td data-h="Módulo">'+esc(x.m)+'</td><td data-h="Agrupamento › Processo"><div class="ap-g">'+esc(x.g)+'</div><div class="ap-s">'+esc(x.sub)+'</div></td><td data-h="Descrição">'+esc(x.desc)+'<button type="button" class="ds-b" data-op="'+esc(x.id)+'">'+(DS[x.id]?'✎ Editar descrição':'+ Descrição')+'</button>'+dsSaved(x.id)+'</td><td data-h="Aderência">'+tag(x.ad,CLR[x.k])+'</td><td data-h="Forma de atendimento">'+tag(x.fa,FC[x.fa])+'</td></tr>'+editor}).join('')+'</tbody></table>':'<div class="ap-empty">Nenhum item com este filtro.</div>'}document.getElementById('ap-out').addEventListener('click',async function(e){var b=e.target.closest('button');if(!b)return;var D=b.dataset;if(D.op){DE[D.op]=1;render();return}if(D.ed){DE[D.ed]=1;render();return}if(D.cn){delete DE[D.cn];render();return}if(D.sv){var k=D.sv;var ta=document.querySelector('[data-ta="'+CSS.escape(k)+'"]');var t=ta?ta.value.trim():'';if(!t){alert('Escreva a descrição antes de salvar.');return}if(!AUTOR){AUTOR=(prompt('Seu nome (aparece junto da descrição):')||'Sem nome').trim()||'Sem nome';au.value=AUTOR;localStorage.setItem('madri-autor',AUTOR)}b.disabled=true;b.textContent='Salvando…';st('','Salvando no banco…');try{await api('POST','/descricoes',{item:k,texto:t,autor:AUTOR});var all=await api('GET','/descricoes');if(!all||!all[k]||!all[k].t)throw new Error('Registro não confirmado após gravação');DS=all;ONLINE=true;delete DE[k];render();focusSaved(k);st('ok','Salvo no banco · '+hh())}catch(err){b.disabled=false;b.textContent='Salvar';st('','Falha ao salvar no banco');alert('A descrição NÃO foi salva no banco: '+err.message)}return}if(D.dl){var k2=D.dl;if(!confirm('Excluir a descrição do item '+k2+'?'))return;try{await api('DELETE','/descricoes/'+encodeURIComponent(k2));delete DS[k2];render();st('ok','Excluído do banco · '+hh())}catch(err){st('','Falha ao excluir do banco');alert('Não foi possível excluir do banco: '+err.message)}}});document.getElementById('ap-bar').addEventListener('click',function(e){var c=e.target.closest('.ap-c');if(!c)return;F.k=c.dataset.f;render()});document.getElementById('ap-bar').addEventListener('change',function(e){if(e.target.id==='ap-m')F.m=e.target.value;render()});(async function init(){try{DS=await api('GET','/descricoes')||{};ONLINE=true;render();st('ok','Banco conectado')}catch(e){DS={};render();st('','Banco indisponível · não é possível salvar')}})();</script></body></html>
