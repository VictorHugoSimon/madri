<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MADRI · RFI × Blueprint</title></head><body><div id="loading" style="font:14px system-ui;padding:24px">Carregando MADRI…</div><script>(async()=>{try{const urls=['data-0.b64','data-1.b64','data-2.b64'];const parts=await Promise.all(urls.map(u=>fetch(u,{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error('Falha ao carregar '+u);return r.text()})));const b=parts.join('').replace(/\s/g,'');const bin=atob(b);const a=Uint8Array.from(bin,c=>c.charCodeAt(0));const ds=new DecompressionStream('gzip');const html=await new Response(new Blob([a]).stream().pipeThrough(ds)).text();document.open();document.write(html);document.close()}catch(e){document.getElementById('loading').textContent='Falha ao carregar: '+e.message;console.error(e)}})();</script></body></html>
