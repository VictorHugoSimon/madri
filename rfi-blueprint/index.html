<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MADRI · RFI × Blueprint</title></head><body><div id="loading" style="font:14px system-ui;padding:24px">Carregando MADRI…</div><script>(async()=>{try{const urls=['data-0.b64','data-1.b64','data-2.b64'];const parts=await Promise.all(urls.map(u=>fetch(u,{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error('Falha ao carregar '+u);return r.text()})));const b=parts.join('').replace(/\s/g,'');const bin=atob(b);const a=Uint8Array.from(bin,c=>c.charCodeAt(0));const ds=new DecompressionStream('gzip');let html=await new Response(new Blob([a]).stream().pipeThrough(ds)).text();const patch=`<script>(function(){var CLOUD={},OUT=null,OBS=null,timer=null;function esc(s){return String(s==null?'':s).replace(/[&<>\"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[c]})}function fmt(v){var d=new Date(v);if(isNaN(d))return '';return d.toLocaleString('pt-BR',{dateStyle:'short',timeStyle:'short'})}function rowFor(k){if(!OUT)return null;var rows=OUT.querySelectorAll('tbody>tr');for(var i=0;i<rows.length;i++){var id=rows[i].querySelector('.ap-id');if(id&&id.textContent.trim()===k)return rows[i]}return null}function status(ok,t){var s=document.getElementById('ds-st');if(!s)return;s.className='ds-st'+(ok?' ok':'');s.textContent=t}function paintOne(k,d,focus){var tr=rowFor(k);if(!tr||!d||!d.t)return;var cell=tr.querySelector('td[data-h=\"Descrição\"]');if(!cell)return;var old=cell.querySelector('.ds-cloud-visible');if(old)old.remove();var box=document.createElement('div');box.className='ds-cloud-visible';box.setAttribute('data-cloud-item',k);box.style.cssText='margin-top:10px;padding:10px 12px;border:1px solid #86efac;background:#f0fdf4;border-radius:8px;text-align:left;';box.innerHTML='<div style=\"font-size:10px;font-weight:800;letter-spacing:.6px;text-transform:uppercase;color:#166534;margin-bottom:5px\">Descrição salva</div><div style=\"font-size:13px;color:#1f2a22;white-space:pre-wrap;line-height:1.45\">'+esc(d.t)+'</div><div style=\"font-size:11px;color:#6b7280;margin-top:6px\">'+esc(d.a||'Sem nome')+(d.c?' · '+fmt(d.c):'')+'</div>';cell.appendChild(box);var op=cell.querySelector('[data-op=\"'+CSS.escape(k)+'\"]');if(op){op.textContent='✎ Editar descrição';op.style.background='#dcfce7'}var nx=tr.nextElementSibling;if(nx&&nx.classList.contains('ds-row')&&!nx.querySelector('[data-ta]'))nx.remove();if(focus){setTimeout(function(){box.scrollIntoView({behavior:'smooth',block:'center'});box.style.outline='3px solid #22c55e';box.style.outlineOffset='2px';box.style.boxShadow='0 0 0 6px rgba(34,197,94,.13)';setTimeout(function(){box.style.outline='';box.style.outlineOffset='';box.style.boxShadow=''},2200)},40)}}function observe(){if(!OUT)return;if(OBS)OBS.disconnect();OBS=new MutationObserver(function(){clearTimeout(timer);timer=setTimeout(paintAll,60)});OBS.observe(OUT,{childList:true,subtree:true})}function paintAll(){if(!OUT)return;if(OBS)OBS.disconnect();Object.keys(CLOUD).forEach(function(k){paintOne(k,CLOUD[k],false)});observe()}async function refresh(){try{var r=await fetch('/api/descricoes',{cache:'no-store'});if(!r.ok)throw new Error('HTTP '+r.status);CLOUD=await r.json()||{};paintAll()}catch(e){console.error('Falha ao carregar descrições da nuvem',e)}}function boot(){OUT=document.getElementById('ap-out');if(!OUT){setTimeout(boot,80);return}OUT.addEventListener('click',async function(e){var sv=e.target.closest('[data-sv]');if(!sv)return;e.preventDefault();e.stopImmediatePropagation();var k=sv.dataset.sv;var ta=document.querySelector('[data-ta=\"'+CSS.escape(k)+'\"]');var texto=ta?ta.value.trim():'';if(!texto){alert('Escreva a descrição antes de salvar.');return}var au=document.getElementById('ds-au');var autor=au?au.value.trim():'';if(!autor){autor=(prompt('Seu nome (aparece junto da descrição):')||'').trim();if(au)au.value=autor;try{localStorage.setItem('madri-autor',autor)}catch(_){} }sv.disabled=true;var old=sv.textContent;sv.textContent='Salvando…';status(false,'Salvando…');try{var r=await fetch('/api/descricoes',{method:'POST',headers:{'Content-Type':'application/json','X-Autor':encodeURIComponent(autor)},body:JSON.stringify({item:k,texto:texto,autor:autor})});var d={};try{d=await r.json()}catch(_){}if(!r.ok)throw new Error(d.error||('HTTP '+r.status));CLOUD[k]={t:d.t||texto,a:d.a||autor||'Sem nome',c:d.c||new Date().toISOString()};var er=sv.closest('tr.ds-row');if(er)er.remove();paintOne(k,CLOUD[k],true);status(true,'Salvo na nuvem');setTimeout(refresh,400)}catch(err){console.error('Falha ao salvar descrição',err);sv.disabled=false;sv.textContent=old;status(false,'Falha ao salvar');alert('Não foi possível salvar a descrição: '+err.message)}},true);observe();refresh()}boot()})();<\/script>`;html=html.replace('</body>',patch+'</body>');document.open();document.write(html);document.close()}catch(e){document.getElementById('loading').textContent='Falha ao carregar: '+e.message;console.error(e)}})();</script></body></html>
