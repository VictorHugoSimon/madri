<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MADRI · RFI × Blueprint</title></head><body><div id="loading" style="font:14px system-ui;padding:24px">Carregando MADRI…</div><script>(async()=>{try{const urls=['data-0.b64','data-1.b64','data-2.b64'];const parts=await Promise.all(urls.map(u=>fetch(u,{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error('Falha ao carregar '+u);return r.text()})));const b=parts.join('').replace(/\s/g,'');const bin=atob(b);const a=Uint8Array.from(bin,c=>c.charCodeAt(0));const ds=new DecompressionStream('gzip');let html=await new Response(new Blob([a]).stream().pipeThrough(ds)).text();const patch=`<script>(function(){function inlineDesc(){var out=document.getElementById('ap-out');if(!out)return;out.querySelectorAll('tr.ds-row').forEach(function(r){var prev=r.previousElementSibling;if(!prev)return;var cell=prev.querySelector('td[data-h="Descrição"]');var box=r.querySelector('.ds-box');if(!cell||!box)return;var old=cell.querySelector('.ds-inline-visible');if(old)old.remove();box.classList.add('ds-inline-visible');box.style.marginTop='10px';box.style.padding='10px 12px';box.style.border='1px solid #86efac';box.style.background='#f0fdf4';box.style.borderRadius='8px';var label=box.querySelector('.ds-l');if(label&&box.querySelector('.ds-t')){label.textContent='Descrição salva';label.style.color='#166534'}cell.appendChild(box);r.remove()})}function boot(){var out=document.getElementById('ap-out');if(!out){setTimeout(boot,100);return}inlineDesc();new MutationObserver(function(){setTimeout(inlineDesc,0)}).observe(out,{childList:true,subtree:true})}boot()})();<\/script>`;html=html.replace('</body>',patch+'</body>');document.open();document.write(html);document.close()}catch(e){document.getElementById('loading').textContent='Falha ao carregar: '+e.message;console.error(e)}})();</script></body></html>
