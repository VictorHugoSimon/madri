<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate"><meta http-equiv="Pragma" content="no-cache"><meta http-equiv="Expires" content="0"><title>MADRI · RFI × Blueprint</title></head><body><div id="loading" style="font:14px system-ui;padding:24px">Carregando MADRI…</div><script>
(async()=>{try{
  const urls=['data-0.b64','data-1.b64','data-2.b64'];
  const parts=await Promise.all(urls.map(u=>fetch(u,{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error('Falha ao carregar '+u);return r.text()})));
  const b=parts.join('').replace(/\s/g,'');
  const bin=atob(b);const a=Uint8Array.from(bin,c=>c.charCodeAt(0));
  const ds=new DecompressionStream('gzip');
  let html=await new Response(new Blob([a]).stream().pipeThrough(ds)).text();

  html=html.replace("var API=/^https?:/.test(location.protocol)?'/api':null,ONLINE=false,DS={},DE={},AUTOR=localStorage.getItem('madri-autor')||'',LK='madri-conc-desc-v1';","var API=/^https?:/.test(location.protocol)?'/api':null,ONLINE=false,DS={},DE={},AUTOR=localStorage.getItem('madri-autor')||'';");
  html=html.replace(/function loc\(\)\{try\{DS=JSON\.parse\(localStorage\.getItem\(LK\)\)\|\|\{\}\}catch\(e\)\{DS=\{\}\}\}\s*function savL\(\)\{try\{localStorage\.setItem\(LK,JSON\.stringify\(DS\)\)\}catch\(e\)\{\}\}/,'');
  html=html.replace(/if\(API\)\{api\('GET','\/descricoes'\)[\s\S]*?\}else\{loc\(\);render\(\);st\('','Salvo só neste computador'\)\}/,"if(API){api('GET','/descricoes').then(function(d){ONLINE=true;DS=d||{};render();st('ok','Banco conectado')},function(e){ONLINE=false;DS={};render();st('','Banco indisponível · não é possível salvar');console.error('Falha ao conectar banco',e)})}else{DS={};render();st('','Banco indisponível · não é possível salvar')}");

  const fixedDesc = String.raw`<script>(function(){
    var DATA={},OUT=null,OBS=null,mutTimer=null,saveTimers={};
    function escSel(v){return (window.CSS&&CSS.escape)?CSS.escape(v):String(v).replace(/([ #;?%&,.+*~\':\"!^$[\]()=>|/@])/g,'\\$1')}
    function author(){var a=document.getElementById('ds-au');var v=a&&a.value?a.value.trim():'';if(v)return v;try{v=(localStorage.getItem('madri-autor')||'').trim()}catch(e){}return v||'Sem nome'}
    function setState(k,txt,ok){var el=document.querySelector('[data-demand-state="'+escSel(k)+'"]');if(!el)return;el.textContent=txt||'';el.style.color=ok===true?'#166534':ok===false?'#b91c1c':'#6b7280'}
    async function load(){try{var r=await fetch('/api/descricoes',{cache:'no-store'});var j={};try{j=await r.json()}catch(e){}if(!r.ok)throw new Error(j.detail||j.error||('HTTP '+r.status));DATA=j||{};apply()}catch(e){console.error('Falha ao carregar descrições',e)}}
    async function save(k,ta){var text=(ta.value||'').trim();if(!text){setState(k,'Sem descrição',null);return}setState(k,'Salvando…',null);ta.style.borderColor='#f59e0b';try{var r=await fetch('/api/descricoes',{method:'POST',headers:{'Content-Type':'application/json','X-Autor':encodeURIComponent(author())},body:JSON.stringify({item:k,texto:text,autor:author()})});var j={};try{j=await r.json()}catch(e){}if(!r.ok||j.ok!==true)throw new Error(j.detail||j.error||('HTTP '+r.status));DATA[k]={t:j.t||text,a:j.a||author(),c:j.c||new Date().toISOString()};ta.value=DATA[k].t;ta.style.borderColor='#22c55e';setState(k,'Salvo no banco',true);setTimeout(function(){if(document.body.contains(ta))ta.style.borderColor='#f59e0b'},1400)}catch(e){console.error('Falha ao salvar '+k,e);ta.style.borderColor='#dc2626';setState(k,'Falha ao salvar',false)}}
    function bindTextarea(k,td){var ta=td.querySelector('textarea[data-demand-item]');if(!ta){ta=document.createElement('textarea');ta.setAttribute('data-demand-item',k);ta.placeholder='Digite a descrição da demanda';ta.style.cssText='width:100%;min-width:220px;min-height:64px;resize:vertical;box-sizing:border-box;border:1px solid #f59e0b;border-radius:9px;padding:9px 10px;background:#fff;color:#374151;font:12px/1.45 system-ui;outline:none;';var state=document.createElement('div');state.setAttribute('data-demand-state',k);state.style.cssText='font:600 10px/1.2 system-ui;color:#6b7280;margin-top:4px;min-height:12px';td.appendChild(ta);td.appendChild(state);ta.addEventListener('input',function(){setState(k,'Alteração não salva',null);clearTimeout(saveTimers[k]);saveTimers[k]=setTimeout(function(){save(k,ta)},900)});ta.addEventListener('blur',function(){clearTimeout(saveTimers[k]);if((ta.value||'').trim()!==(DATA[k]&&DATA[k].t||''))save(k,ta)});}
      if(DATA[k]&&DATA[k].t&&document.activeElement!==ta)ta.value=DATA[k].t;
      if(DATA[k]&&DATA[k].t)setState(k,'Salvo no banco',true);else setState(k,'',null);
    }
    function apply(){OUT=document.getElementById('ap-out');if(!OUT)return;var tables=OUT.querySelectorAll('table');tables.forEach(function(table){var rows=table.querySelectorAll('tbody>tr');var has=false;rows.forEach(function(tr){if(tr.querySelector('.ap-id'))has=true});if(!has)return;var hr=table.querySelector('thead tr');if(hr&&!hr.querySelector('th[data-demand-head]')){var th=document.createElement('th');th.setAttribute('data-demand-head','1');th.textContent='DESCRIÇÃO DA DEMANDA';th.style.minWidth='240px';hr.appendChild(th)}rows.forEach(function(tr){if(tr.classList.contains('ds-row')){tr.style.display='none';return}var id=tr.querySelector('.ap-id');if(!id)return;var k=id.textContent.trim();var op=tr.querySelector('[data-op]');if(op)op.style.display='none';var td=tr.querySelector('td[data-demand-cell]');if(!td){td=document.createElement('td');td.setAttribute('data-demand-cell',k);td.style.cssText='vertical-align:top;min-width:240px;width:260px;padding-top:10px;padding-bottom:10px;';tr.appendChild(td)}bindTextarea(k,td)})})}
    function watch(){OUT=document.getElementById('ap-out');if(!OUT){setTimeout(watch,80);return}apply();if(OBS)OBS.disconnect();OBS=new MutationObserver(function(){clearTimeout(mutTimer);mutTimer=setTimeout(apply,60)});OBS.observe(OUT,{childList:true,subtree:true});load()}
    watch();
  })();</script>`;
  html=html.replace('</body>',fixedDesc+'<div id="madri-build" style="display:none">demand-column-20261016</div></body>');
  document.open();document.write(html);document.close();
}catch(e){document.getElementById('loading').textContent='Falha ao carregar: '+e.message;console.error(e)}})();
</script></body></html>
